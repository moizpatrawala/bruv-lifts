<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bruv Lifts">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#09090c">
<meta name="color-scheme" content="dark">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Bruv Lifts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Bruv Lifts, dark edition. Near-black floor, quiet charcoal cards, one electric blue for "do this", gold only for wins.
   Barlow Condensed (italic, uppercase) does the shouting and the numbers; Inter does the talking. */
:root{
  --bg:#09090c; --card:#141419; --card2:#1b1b22; --card3:#25252e; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --text:#f5f5f7; --text2:#a3a3b0; --text3:#64646f;
  --blue:#4c76ff; --blue2:#2b55f0; --glow:rgba(76,118,255,.45); --gold:#ffc83d; --gold2:#ffb300; --green:#34d399; --red:#ff5a6e;
  --d:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --b:"Inter",-apple-system,system-ui,sans-serif;
  --r:24px; --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation;background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:500 15px/1.45 var(--b);-webkit-font-smoothing:antialiased;letter-spacing:-.005em;
  padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 112px) max(16px,env(safe-area-inset-left))}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(70% 45% at 10% -8%,rgba(76,118,255,.22),transparent 70%),radial-gradient(55% 35% at 105% -5%,rgba(255,200,61,.07),transparent 70%)}
body.resting{padding-bottom:calc(env(safe-area-inset-bottom) + 180px)}
body.locked{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
h1,h2,h3,p,ul,ol{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.d{font-family:var(--d);font-weight:800;text-transform:uppercase;letter-spacing:.005em;line-height:.92}
.it{font-style:italic}
.t1{font-size:40px}.t2{font-size:28px}.t3{font-size:21px}
.mute{color:var(--text2);font-size:14px}.mute b{color:var(--text);font-weight:700}
.dim{color:var(--text3)}
.center{text-align:center}
.eyebrow{font:700 11.5px/1 var(--b);letter-spacing:.14em;text-transform:uppercase;color:var(--text2)}
main{max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.wname{width:0}

/* header */
.top{max-width:560px;margin:0 auto 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font:800 25px/1 var(--d);font-style:italic;text-transform:uppercase;letter-spacing:.01em}
.brand b{color:var(--blue);font-weight:800}
.pills{display:flex;gap:6px}
.pill{background:var(--card);border:1px solid var(--line2);border-radius:99px;padding:7px 11px;font:700 13px/1 var(--b);display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.pill.hot{background:rgba(255,200,61,.12);border-color:rgba(255,200,61,.35);color:var(--gold)}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0}
.card,.rlist,.wdet,.exl,.redit,.sc,.hero,.sum,.prlist{grid-template-columns:minmax(0,1fr)}
.rowb{display:flex;justify-content:space-between;align-items:center;gap:10px}
.page{font-size:46px;margin:2px 0 4px}
.empty{padding:18px 8px;text-align:center;color:var(--text2)}
.sec{font:700 12px/1 var(--b);letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin:8px 2px -2px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:14px 18px;font:700 15.5px/1 var(--b);background:var(--card3);color:var(--text);border:1px solid var(--line2);transition:transform .12s var(--ease),filter .12s;text-align:center}
.btn:active{transform:scale(.97);filter:brightness(1.1)}
.btn.pri{background:linear-gradient(180deg,#6188ff,#2b55f0);border-color:transparent;color:#fff;box-shadow:0 14px 30px -12px var(--glow),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.gold{background:linear-gradient(180deg,#ffd666,#ffb300);border-color:transparent;color:#1d1400}
.btn.white{background:#fff;border-color:transparent;color:#0b0b10}
.btn.red{background:rgba(255,90,110,.14);border-color:rgba(255,90,110,.35);color:var(--red)}
.btn.xl{font:800 24px/1 var(--d);font-style:italic;text-transform:uppercase;letter-spacing:.03em;padding:19px 18px;border-radius:20px;width:100%}
.btn.xl small{font:700 15px var(--d);opacity:.65;letter-spacing:.04em}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.link{font:600 14.5px var(--b);color:var(--text2);padding:12px;justify-self:center}
.link.danger{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -18px;padding:0 18px 2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{background:var(--card2);border:1px solid var(--line2);color:var(--text);border-radius:99px;padding:10px 15px;font:600 14px/1 var(--b);white-space:nowrap;flex:none}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.ghost{color:var(--text2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Bruv */
.chat{display:flex;align-items:flex-end;gap:10px}
.ava{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none;background:radial-gradient(circle at 50% 30%,#3a4f9e,#151a33);border:1px solid var(--line2)}
.ava img{width:100%;height:auto;display:block;margin-top:3px}
.msg{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:20px 20px 20px 6px;padding:11px 14px 12px}
.msg b{display:block;font:700 11px/1 var(--b);letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:5px}
.msg p{font:500 15px/1.4 var(--b)}
.pop{animation:pop .3s var(--ease)}
@keyframes pop{from{transform:translateY(4px);opacity:.3}}
.mascot{width:auto;flex:none}

/* today hero */
.hero{position:relative;border-radius:30px;padding:22px 20px 20px;overflow:hidden;display:grid;gap:18px;min-height:250px;
  background:radial-gradient(120% 100% at 100% 0%,#5d84ff 0%,#2b55f0 38%,#172a7a 75%,#101a45 100%);box-shadow:0 30px 60px -30px rgba(43,85,240,.8)}
.hero.rest{background:radial-gradient(120% 100% at 100% 0%,#3b3b4d 0%,#23232f 50%,#15151c 100%);box-shadow:none}
.hero.done{background:radial-gradient(120% 100% at 100% 0%,#2fd69b 0%,#0f8a5f 45%,#0b3d2c 100%);box-shadow:0 30px 60px -30px rgba(52,211,153,.6)}
.hero::after{content:attr(data-wm);position:absolute;right:-8px;bottom:-26px;font:800 150px/1 var(--d);font-style:italic;color:rgba(255,255,255,.06);pointer-events:none;letter-spacing:-.02em}
.hero .tx{position:relative;z-index:1;max-width:64%;display:grid;gap:8px;align-content:start}
.hero .eyebrow{color:rgba(255,255,255,.75)}
.hero h1{font-size:54px;line-height:.86;font-style:italic}
.hero p{color:rgba(255,255,255,.8);font-weight:600;font-size:14px}
.hero .mascot{position:absolute;right:-4px;top:14px;height:178px;z-index:1;filter:drop-shadow(0 14px 18px rgba(0,0,0,.35))}
.hero .btn{position:relative;z-index:2;align-self:end}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:grid;justify-items:center;gap:7px;padding:10px 0;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.wd b{font:700 11px/1 var(--b);color:var(--text3);letter-spacing:.06em}
.wd i{font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:800 15px/1 var(--d);background:var(--card3);color:var(--text2)}
.wd.done i{background:var(--green);color:#03140d}
.wd.miss i{background:rgba(255,90,110,.14);color:var(--red)}
.wd.rest i{background:transparent;color:var(--text3);border:1px dashed var(--line2)}
.wd.today{border-color:var(--blue);background:rgba(76,118,255,.1)}
.wd.today b{color:var(--blue)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 14px 12px;min-width:0}
.tile b{display:block;font:800 34px/1 var(--d);letter-spacing:.01em}
.tile span{font:600 12px/1.2 var(--b);color:var(--text2)}
.tile.gold b{color:var(--gold)}.tile.blue b{color:var(--blue)}
.plan{list-style:none;padding:0;display:grid}
.plan li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0;padding-top:2px}
.plan .ix{font:800 15px/1 var(--d);color:var(--text3);width:20px}
.plan .nm{flex:1;min-width:0;font-weight:600}
.plan .nm small{display:block;color:var(--text3);font-weight:500;font-size:12.5px}
.plan .sr{font:800 19px/1 var(--d);color:var(--text2);letter-spacing:.02em}

/* workout */
.wtop{position:sticky;top:0;z-index:20;margin:calc(-14px - env(safe-area-inset-top)) -16px 0;padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;
  background:rgba(9,9,12,.78);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--line);display:grid;gap:10px}
.wtop .r{display:flex;align-items:center;gap:12px}
.wname{flex:1;min-width:0;border:0;background:none;font:800 26px/1 var(--d);font-style:italic;text-transform:uppercase;padding:0;outline:0;color:var(--text)}
.clock{font:700 26px/1 var(--d);color:var(--text2);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:9px;background:var(--card3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--blue2),#8aa6ff);transition:width .4s var(--ease)}
.wtop .meta{display:flex;justify-content:space-between;font:600 12.5px var(--b);color:var(--text2)}
.ex{scroll-margin-top:130px}
.ex.open{border-color:rgba(76,118,255,.35);background:linear-gradient(180deg,rgba(76,118,255,.07),transparent 140px),var(--card)}
.ex header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex .num{font:800 14px/1 var(--d);color:var(--blue);letter-spacing:.08em}
.ex h3{font:800 30px/.95 var(--d);text-transform:uppercase;font-style:italic;margin-top:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font:600 11.5px/1 var(--b);padding:6px 9px;border-radius:99px;background:var(--card3);color:var(--text2)}
.tag.blue{background:rgba(76,118,255,.15);color:#9db4ff}
.icon{width:40px;height:40px;border-radius:50%;background:var(--card3);font:800 18px/1 var(--b);color:var(--text2);flex:none}
.last{display:flex;gap:10px;align-items:baseline;font-size:14px;color:var(--text2)}
.last .eyebrow{flex:none;color:var(--text3);font-size:10.5px}
.last b{color:var(--text);font-weight:600}
.nudge{display:flex;gap:10px;align-items:center;background:rgba(255,200,61,.08);border:1px solid rgba(255,200,61,.3);border-radius:16px;padding:12px 14px;text-align:left;font:500 14.5px/1.35 var(--b);color:var(--text)}
.nudge b{color:var(--gold)}
.sets{list-style:none;padding:0;display:grid;gap:6px}
.sets button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);text-align:left}
.sets .n{font:800 14px/1 var(--d);color:var(--text3);width:22px}
.sets .v{font:700 23px/1 var(--d);letter-spacing:.02em}
.sets .u{font:600 12px var(--b);color:var(--text3)}
.prb{margin-left:auto;font:800 13px/1 var(--d);letter-spacing:.08em;color:#1d1400;background:linear-gradient(180deg,#ffd666,#ffb300);border-radius:8px;padding:4px 7px 3px}
.steppers{display:grid;gap:10px}
.sp{display:grid;grid-template-columns:60px 1fr 60px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:22px;height:86px;padding:0 10px}
.sp button{width:56px;height:56px;border-radius:50%;background:var(--card3);border:1px solid var(--line2);font:500 30px/1 var(--b);color:var(--text);display:grid;place-items:center}
.sp button:active{background:var(--blue);border-color:var(--blue);color:#fff}
.sp .mid{display:grid;justify-items:center;gap:2px;min-width:0}
.sp .mid span{font:700 10.5px/1 var(--b);letter-spacing:.14em;color:var(--text3);text-transform:uppercase}
.sp input{width:100%;min-width:0;border:0;text-align:center;font:700 46px/1 var(--d);background:transparent;outline:0;padding:0;color:var(--text);font-variant-numeric:tabular-nums}
.log{scroll-margin-bottom:calc(env(safe-area-inset-bottom) + 170px)}
.ex.shut{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;width:100%}
.ex.shut .nm{flex:1;min-width:0}
.ex.shut h3{font-size:22px;margin:0}
.ex.shut .mute{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{flex:none}

/* rest */
#rest{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:39;padding:0 14px;display:flex;justify-content:center;pointer-events:none}
#rest .rb{pointer-events:auto;width:100%;max-width:528px;background:rgba(30,30,38,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line2);border-radius:22px;padding:6px 6px 6px 16px;box-shadow:0 18px 40px -14px rgba(0,0,0,.7);display:flex;align-items:center;gap:8px}
#restT{font:800 30px/1 var(--d);color:var(--gold);min-width:62px;display:grid;font-variant-numeric:tabular-nums}
#restT small{font:700 9.5px/1 var(--b);color:var(--text3);letter-spacing:.16em;margin-bottom:3px}
.track{position:relative;flex:1;height:46px;border-bottom:2px dashed rgba(255,255,255,.14);margin-bottom:8px}
#runner{position:absolute;bottom:-2px;height:46px;left:0;transition:left .3s linear}
.track .fin{position:absolute;right:0;bottom:3px;font-size:18px}
#rest .rb>button{background:var(--card3);border:1px solid var(--line2);border-radius:14px;padding:12px 11px;font:700 13.5px/1 var(--b);flex:none}
#rest.go .rb{background:linear-gradient(180deg,#ffd666,#ffb300);border-color:transparent;color:#1d1400}
#rest.go #restT,#rest.go #restT small{color:#1d1400}
#rest.go .rb>button{background:rgba(0,0,0,.12);border-color:transparent}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:40;display:flex;justify-content:center;padding:0 14px;pointer-events:none}
.tabs>div{pointer-events:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:528px;background:rgba(24,24,31,.82);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--line2);border-radius:26px;padding:6px;box-shadow:0 20px 40px -12px rgba(0,0,0,.7)}
.tabs button{display:grid;justify-items:center;gap:4px;padding:9px 4px 8px;border-radius:20px;font:600 11px/1 var(--b);color:var(--text3);position:relative;transition:color .15s,background .15s}
.tabs svg{width:24px;height:24px}
.tabs button[aria-selected=true]{color:#fff;background:rgba(76,118,255,.18)}
.tabs button[aria-selected=true] svg{color:var(--blue)}
.tabs .live::after{content:"";position:absolute;top:7px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(255,90,110,.25);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.4}}

/* sheet + overlays */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.sc{background:var(--card);border:1px solid var(--line2);border-bottom:0;border-radius:28px 28px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:18px max(18px,env(safe-area-inset-left)) calc(26px + env(safe-area-inset-bottom));display:grid;gap:14px;animation:up .28s var(--ease)}
@keyframes up{from{transform:translateY(50px);opacity:.3}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--card3);justify-self:center;margin:-6px 0 0}
.field{display:grid;gap:7px}
.field>span{font:700 11px/1 var(--b);letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.txt{width:100%;border:1px solid var(--line2);border-radius:14px;padding:13px 14px;font:600 16.5px var(--b);background:var(--card2);color:var(--text);outline:0}
.txt:focus{border-color:var(--blue)}
.exl{display:grid;gap:6px}
.exl h4{margin:10px 2px 2px;font:700 11px/1 var(--b);letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.exi{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font:600 15.5px var(--b)}
.exi small{font:500 12.5px var(--b);color:var(--text3);white-space:nowrap}
.exi.add{border:1px dashed var(--blue);background:rgba(76,118,255,.08);color:#9db4ff}
#pr{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;padding:24px}
.prc{position:relative;background:radial-gradient(90% 60% at 50% 0%,rgba(255,200,61,.32),transparent 70%),var(--card);border:1px solid rgba(255,200,61,.45);border-radius:32px;padding:16px 22px 22px;text-align:center;max-width:360px;width:100%;display:grid;gap:8px;justify-items:center;
  box-shadow:0 0 80px -10px rgba(255,200,61,.35);animation:slam .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes slam{from{transform:scale(1.6);opacity:0}}
.prc .mascot{height:136px;margin-top:-80px;filter:drop-shadow(0 12px 16px rgba(0,0,0,.5))}
.stamp{font:800 76px/.85 var(--d);font-style:italic;text-transform:uppercase;color:var(--gold);text-shadow:0 0 30px rgba(255,200,61,.55)}
.prc .huge{font:800 54px/1 var(--d);letter-spacing:.01em}
.prc .huge span{font-size:24px;color:var(--text2)}
.confetti{position:fixed;inset:0;z-index:80;pointer-events:none;width:100vw;height:100vh}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);z-index:90;background:#fff;color:#0b0b10;border-radius:99px;padding:11px 18px;font:700 14.5px var(--b);box-shadow:0 12px 30px -8px rgba(0,0,0,.6);max-width:90vw;text-align:center}
.sum{display:grid;gap:14px;justify-items:center;text-align:center}
.sum .mascot{height:150px}
.sum .tiles{width:100%}
.prlist{width:100%;display:grid;gap:6px;text-align:left}
.prlist div{display:flex;justify-content:space-between;gap:10px;background:rgba(255,200,61,.08);border:1px solid rgba(255,200,61,.3);border-radius:14px;padding:11px 14px;font-weight:600}
.prlist div b{font:800 19px/1 var(--d);color:var(--gold)}
.trow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line2);border-radius:16px;padding:12px 14px}
.trow i{font-style:normal;font-size:28px}

/* history */
.heat svg{width:100%;height:auto;display:block}
.wcard{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px 16px}
.wcard .dt{width:50px;flex:none;text-align:center}
.wcard .dt b{display:block;font:800 32px/1 var(--d)}

    let y=0;for(const s of it.sets){if(met==="e1rm")y=Math.max(y,e1(s.w,s.r));else if(met==="top")y=Math.max(y,s.w);else if(met==="vol")y+=s.w*s.r;else if(met==="reps")y=Math.max(y,s.r);else if(met==="treps")y+=s.r}

}
function lineChart(pts,unit){
  if(pts.length<2)return `<p class="empty">${pts.length?"One session logged. Do it again and I'll draw you a line.":"No sessions yet."}</p>`;
  const W=340,H=190,Lp=38,R=10,T=14,B=26,ys=pts.map(p=>p.y);let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<1){hi+=1;lo-=1}const pad=(hi-lo)*.18;lo=Math.max(0,lo-pad);hi+=pad;
  const X=i=>Lp+(W-Lp-R)*i/(pts.length-1),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo)),f=v=>v>=1000?(v/1000).toFixed(1)+"k":String(Math.round(v*10)/10);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4c76ff" stop-opacity=".35"/><stop offset="1" stop-color="#4c76ff" stop-opacity="0"/></linearGradient></defs>`;
  for(let g=0;g<=3;g++){const v=lo+(hi-lo)*g/3,y=Y(v);s+=`<line x1="${Lp}" x2="${W-R}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)" stroke-width="1"/><text x="${Lp-8}" y="${y+4}" text-anchor="end" font-size="11" font-weight="600" fill="#64646f" font-family="Inter">${f(v)}</text>`}
  const d=pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(" ");
  s+=`<path d="${d} L${X(pts.length-1)} ${H-B} L${Lp} ${H-B}Z" fill="url(#ga)"/><path d="${d}" fill="none" stroke="#4c76ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 4px 10px rgba(76,118,255,.6))"/>`;
  pts.forEach((p,i)=>{const x=X(i),y=Y(p.y);s+=p.pr?`<path transform="translate(${x} ${y})" d="M0-9 2.6-3 9-2.8 4-1.1 5.6 7.6 0 4.8-5.6 7.6-4 1.1-9-2.8-2.6-3Z" fill="#ffc83d" stroke="#09090c" stroke-width="1.5" stroke-linejoin="round"><title>${fdate(p.t)}: ${f(p.y)} ${unit} (PR)</title></path>`:`<circle cx="${x}" cy="${y}" r="4" fill="#09090c" stroke="#4c76ff" stroke-width="2.4"><title>${fdate(p.t)}: ${f(p.y)} ${unit}</title></circle>`});
  s+=`<text x="${Lp}" y="${H-6}" font-size="11" font-weight="600" fill="#64646f" font-family="Inter">${fdate(pts[0].t,{day:"numeric",month:"short"})}</text><text x="${W-R}" y="${H-6}" text-anchor="end" font-size="11" font-weight="600" fill="#64646f" font-family="Inter">${fdate(pts.at(-1).t,{day:"numeric",month:"short"})}</text>`;
  return s+"</svg>";
}
function weekBars(){
  const N=12,cur=weekStart(Date.now()),v=Array(N).fill(0);
  for(const w of S.workouts){const k=Math.round((cur-weekStart(w.start))/(7*DAY));if(k>=0&&k<N)v[N-1-k]+=toD(wVol(w))}
  const mx=Math.max(...v,1),W=340,H=150,B=22,bw=(W-10)/N;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly volume, last 12 weeks">`;
  v.forEach((x,i)=>{const h=x?Math.max(6,(H-B-18)*x/mx):3,X=5+i*bw+3,Y=H-B-h;s+=`<rect x="${X}" y="${Y}" width="${bw-6}" height="${h}" rx="6" fill="${i===N-1?"#ffc83d":x?"#4c76ff":"#1b1b22"}" opacity="${i===N-1||!x?1:(.55+.45*x/mx).toFixed(2)}"><title>${num(x)} ${S.unit}</title></rect>`;if(x&&(i===N-1||x===mx))s+=`<text x="${X+(bw-6)/2}" y="${Y-6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a3a3b0" font-family="Inter">${x>=1000?(x/1000).toFixed(1)+"k":Math.round(x)}</text>`});
  s+=`<text x="5" y="${H-5}" font-size="11" font-weight="600" fill="#64646f" font-family="Inter">12 weeks ago</text><text x="${W-5}" y="${H-5}" text-anchor="end" font-size="11" font-weight="600" fill="#64646f" font-family="Inter">this week</text>`;

}

/* --- ranks + XP --- */
const RANKS=[["Baby Chimp",0,"🍼"],["Monkey",500,"🐵"],["Macaque",1500,"🐒"],["Baboon",3500,"🍌"],["Chimp",7000,"💪"],["Orangutan",12000,"🦧"],["Gorilla",20000,"🦍"],["Silverback",32000,"⚡"],["King Kong",50000,"👑"],["Bruv Himself",80000,"😎"]];
function xpOf(ws=S.workouts){const {flags}=scan();let x=0;for(const w of ws){x+=100;for(const it of w.items)for(const s of it.sets){if(!isWork(s))continue;x+=10;if(flags.has(s))x+=50}}return x}
function rankOf(x){let i=0;while(i+1<RANKS.length&&x>=RANKS[i+1][1])i++;const [name,at,ic]=RANKS[i],nx=RANKS[i+1];return {i,name,ic,at,xp:x,next:nx?nx[1]:null,nextName:nx?nx[0]:null,p:nx?(x-at)/(nx[1]-at):1}}

/* --- last week recap --- */
function recapCard(){
  const ws=weekStart(Date.now()),a=addDays(ws,-7),b=addDays(ws,-14),Lw=S.workouts.filter(w=>w.start>=a&&w.start<ws),Pw=S.workouts.filter(w=>w.start>=b&&w.start<a);
  if(!Lw.length)return "";
  const v=Lw.reduce((s,w)=>s+wVol(w),0),pv=Pw.reduce((s,w)=>s+wVol(w),0),{flags}=scan();
  const prs=Lw.reduce((s,w)=>s+w.items.reduce((t,it)=>t+it.sets.filter(x=>flags.has(x)).length,0),0);
  const days=new Set(Lw.map(w=>day0(w.start))).size,planned=WEEK.filter(d=>schedFor(d)).length||days,delta=pv?Math.round((v-pv)/pv*100):null;
  const verdict=days>=planned?"Perfect week. I'd hug you but I'm a cartoon.":delta!==null&&delta>0?"More volume than the week before. That's how it's done.":days>=planned-1?"One short of perfect. So close it hurts.":"Bit of a quiet one. This week we fix that.";

/* --- smart rest --- */
const COMPOUND=new Set(["bench","incbench","dbbench","incdb","deadlift","row","pullup","chinup","tbar","ohp","dbohp","squat","frontsquat","rdl","legpress","hack","hipthrust","dips","cgbench","bulgarian"]);
const ISO=new Set(["fly","pecdeck","lateral","cablelat","rearfly","facepull","legext","legcurl","calf","seatedcalf","abduct","shrug","straightarm"]);
function restFor(e){if(!S.smart)return S.rest;if(COMPOUND.has(e.id))return Math.max(S.rest,150);if(ISO.has(e.id)||e.muscle==="Arms"||e.muscle==="Core")return Math.min(S.rest,75);return S.rest}

/* --- warm-ups --- */
function warmups(it){
  const e=ex(it.ex);if(!e||e.eq!=="bb"||it.sets.length)return null;
  const W=toD(it.d.w),bar=S.unit==="kg"?20:45;if(W<bar+15)return null;
  const rd=v=>Math.max(bar,S.unit==="kg"?Math.round(v/2.5)*2.5:Math.round(v/5)*5);
  const out=[[bar,10]];for(const [p,r] of [[.4,5],[.6,3],[.8,2]]){const w=rd(W*p);if(w>out.at(-1)[0]&&w<W)out.push([w,r])}return out;
}

/* --- form cues --- */
const CUES={bench:"Shoulder blades pinned back and down, feet planted, bar to lower chest, press up and slightly back.",incbench:"Bench at 30–45°. Elbows about 45°, touch the upper chest, no bouncing.",dbbench:"Lower until you feel the stretch, then press up and slightly in.",incdb:"Low incline, wrists stacked over elbows, deep stretch, squeeze at the top.",chestpress:"Handles level with mid-chest. Control the way back; don't let the stack touch.",fly:"Elbows soft and locked. Hug a tree, squeeze, slow on the way out.",pecdeck:"Chest up, elbows soft, one-second squeeze in the middle.",dips:"Lean forward for chest, upright for triceps. Shoulders just below elbows.",pushup:"One straight line from head to heels, elbows at 45°, chest touches first.",
  deadlift:"Bar over mid-foot, brace hard, push the floor away. Bar drags up your legs. No rounding.",row:"Hinge to about 45°, pull to your belly button, elbows back, no heaving.",dbrow:"Flat back, elbow to hip like starting a lawnmower, pause at the top.",pullup:"Dead hang, chest to the bar, elbows down to your ribs. No kipping, Tony.",chinup:"Palms facing you, full hang, chin clearly over.",pulldown:"Slight lean back, bar to the top of your chest, elbows to your sides, slow return.",cablerow:"Chest up, pull to your stomach, squeeze the shoulder blades. Don't rock.",tbar:"Hinge and brace, pull to the lower chest, pause.",straightarm:"Arms nearly straight, sweep the bar to your thighs with your lats.",shrug:"Straight up to your ears, hold, straight down. No rolling.",
  ohp:"Glutes and abs tight, bar from collarbone straight up, head through at the top.",dbohp:"Back on the pad, press up without clanging the dumbbells.",arnold:"Palms facing you at the bottom, rotate as you press. Smooth.",lateral:"Lead with the elbows to shoulder height. Leave your ego at home.",cablelat:"Cable behind you, constant tension, out to shoulder height.",rearfly:"Hinge forward, open wide, squeeze the back of the shoulders.",facepull:"Rope at face height, pull to your eyes, thumbs back. Your shoulders will thank you.",
  curl:"Elbows pinned, no swinging, squeeze at the top, slow on the way down.",dbcurl:"Turn the pinky up at the top, full stretch at the bottom.",hammer:"Thumbs up, elbows still. Builds the forearms too.",preacher:"Armpits on the pad, full stretch at the bottom, don't drop it.",cablecurl:"Step back for tension, elbows still, squeeze.",inclinecurl:"Arms hang behind you for a big stretch. Lighter than you think.",pushdown:"Elbows glued to your sides, lock out fully, control the way up.",ohext:"Elbows point up, stretch deep behind your head, extend fully.",skull:"Lower to just behind your forehead, elbows narrow. Don't actually crush your skull.",cgbench:"Hands shoulder width, elbows tucked, touch the lower chest.",
  squat:"Brace, sit between your heels, knees over toes, hip crease below the knee, drive up.",frontsquat:"Elbows high, chest up, sit straight down.",rdl:"Soft knees, hips back, bar close, stop when your hamstrings say stop.",legpress:"Lower until knees are near 90°, don't let your lower back peel off the pad.",hack:"Back flat, as deep as you control, push through the whole foot.",goblet:"Bell at your chest, elbows inside the knees at the bottom.",lunge:"Long step, back knee kisses the floor, push through the front heel.",bulgarian:"Most weight on the front leg, go deep. Yes, it's supposed to hurt.",legext:"Squeeze the quads hard at the top for a second.",legcurl:"Hips down, curl all the way, slow negative.",hipthrust:"Chin tucked, drive through the heels, squeeze the glutes at the top.",calf:"Full stretch, pause, all the way up. No bouncing.",seatedcalf:"Pause in the stretch, then squeeze up. They're stubborn.",abduct:"Push out, control back.",
  hlr:"Dead hang, curl the pelvis up, no swinging.",crunch:"Ribs to hips, hips stay still.",abwheel:"Brace like someone's about to punch you. Roll out only while your lower back stays flat.",situp:"Controlled down, curl up, don't yank your neck.",russian:"Chest up, rotate from the ribs, not just the arms."};

/* --- plates --- */
const PL={kg:[[25,"#e5383b",1],[20,"#2b55f0",.95],[15,"#ffc83d",.85],[10,"#34d399",.75],[5,"#f5f5f7",.6],[2.5,"#ff5a6e",.5],[1.25,"#a3a3b0",.42]],lb:[[45,"#2b55f0",1],[35,"#ffc83d",.9],[25,"#34d399",.78],[10,"#f5f5f7",.6],[5,"#ff5a6e",.5],[2.5,"#a3a3b0",.42]]};
let PLW=null,PLB=null,PLI=null;
function loadOut(total,bar){let side=(total-bar)/2;const out=[];if(side<0)return {out,left:0};for(const [p] of PL[S.unit])while(side>=p-1e-9){out.push(p);side-=p}return {out,left:Math.round(side*100)/100}}
function barSVG(out){
  const H=130;let x=118,s=`<svg viewBox="0 0 340 ${H}" width="100%" aria-hidden="true"><rect x="0" y="${H/2-5}" width="340" height="10" rx="5" fill="#4a4a56"/><rect x="104" y="${H/2-16}" width="14" height="32" rx="4" fill="#a3a3b0"/>`;
  for(const p of out){const [,c,h]=PL[S.unit].find(q=>q[0]===p),w=h>=.75?20:14,hh=(H-8)*h;s+=`<rect x="${x}" y="${(H-hh)/2}" width="${w}" height="${hh}" rx="5" fill="${c}" stroke="#09090c" stroke-width="2"/>`;x+=w+2}
  return s+`<rect x="${x}" y="${H/2-10}" width="12" height="20" rx="3" fill="#a3a3b0"/></svg>`;
}
function plOut(){const tot=toD(PLW),{out,left}=loadOut(tot,PLB);
  return `<div class="barviz">${barSVG(out)}</div><p class="d" style="font-size:28px;text-align:center">${tot<PLB?"Lighter than the bar":out.length?"Each side: "+out.join(" + "):"Just the bar"}</p>${left>0?`<p class="mute center">Can't make it exactly: ${left} ${S.unit} per side left over.</p>`:""}`}
function plateSheet(w,i){PLW=w??PLW??fromD(S.unit==="kg"?60:135);if(PLB==null||(S.unit==="kg")!==(PLB<=20))PLB=S.unit==="kg"?20:45;PLI=i;drawPlates()}
function drawPlates(){sheet(`<h2 class="d it t2">Plate math</h2>${stepRow("plw",fw(PLW),"total "+S.unit,"w",'data-plate="1"')}
  <div class="field"><span>Bar</span><div class="seg wide">${(S.unit==="kg"?[20,15,10]:[45,35,25]).map(b=>`<button class="${PLB===b?"on":""}" data-act="plBar" data-v="${b}">${b} ${S.unit}</button>`).join("")}</div></div>
  <div id="plout">${plOut()}</div>${PLI!=null?`<button class="btn pri wide" data-act="plUse">Use this weight</button>`:""}`)}

/* --- 1RM + % chart --- */
let ORM=null;
function ormOut(){const m=e1(ORM.w,ORM.r),rd=v=>S.unit==="kg"?Math.round(v/2.5)*2.5:Math.round(v/5)*5,reps={95:2,90:4,85:6,80:8,75:10,70:12,65:15,60:18,50:25};
  return `<div class="orm"><span class="eyebrow">Estimated one-rep max</span><b class="d">${fe(m)}<em> ${S.unit}</em></b></div><div class="pct">${[95,90,85,80,75,70,65,60,50].map(p=>`<div><span>${p}%</span><b>${rd(toD(m)*p/100)}</b><small>about ${reps[p]} reps</small></div>`).join("")}</div>`}
function ormSheet(){ORM=ORM||{w:fromD(S.unit==="kg"?60:135),r:5};sheet(`<h2 class="d it t2">One-rep max</h2><p class="mute">Put in a set you did. Bruv works out your max and what to load for other rep ranges.</p><div class="steppers">${stepRow("ormw",fw(ORM.w),S.unit,"w",'data-orm="w"')}${stepRow("ormr",ORM.r,"reps","r",'data-orm="r"')}</div><div id="ormout">${ormOut()}</div>`)}
function tools(){sheet(`<h2 class="d it t2">Toolbox</h2><div class="toolgrid"><button class="tool" data-act="plates"><i>🏋️</i><b>Plate math</b></button><button class="tool" data-act="orm"><i>🧮</i><b>1RM & %</b></button><button class="tool" data-act="bwLog"><i>⚖️</i><b>Bodyweight</b></button></div>`)}

/* --- bodyweight + strength levels --- */
const bwNow=()=>S.bw.length?S.bw[S.bw.length-1].kg:null;
function bwSheet(){const v=bwNow()??fromD(S.unit==="kg"?75:165);sheet(`<h2 class="d it t2">Bodyweight</h2>${stepRow("bwv",fw(v),S.unit,"b")}<button class="btn pri wide" data-act="bwSave">Save</button>${S.bw.length?`<p class="mute center">Last: ${fw(bwNow())} ${S.unit}, ${ago(S.bw.at(-1).at)}. One entry per day; saving again today replaces it.</p>`:""}`)}
function bodyCard(){
  if(!S.bw.length)return `<section class="card"><span class="eyebrow">Bodyweight</span><p class="mute">Log your weight now and then. It unlocks strength levels and a trend line.</p><button class="btn wide" data-act="bwLog">⚖️ Log bodyweight</button></section>`;
  const ref=S.bw.find(x=>x.at>=Date.now()-30*DAY)||S.bw[0],d=r1(toD(bwNow()-ref.kg));
  return `<section class="card chart"><div class="rowb"><span class="eyebrow">Bodyweight</span><button class="btn sm" data-act="bwLog">+ Log</button></div>
    <div class="bwnow"><b class="d">${fw(bwNow())}<em> ${S.unit}</em></b>${S.bw.length>1?`<span class="delta ${d<=0?"down":"up"} neutral">${d>0?"+":""}${d} ${S.unit} in 30 days</span>`:""}</div>
    ${S.bw.length>1?lineChart(S.bw.map(x=>({t:x.at,y:toD(x.kg),pr:false})),S.unit):`<p class="mute">Log it again in a few days for a trend line.</p>`}</section>`;
}
const STD={bench:[.5,.75,1,1.5,2],squat:[.75,1.25,1.5,2,2.5],deadlift:[1,1.5,2,2.5,3],ohp:[.35,.55,.75,1,1.25]},TIERS=["Beginner","Novice","Intermediate","Advanced","Elite"];
function standardsCard(){
  const bw=bwNow(),{best}=scan(),have=Object.keys(STD).filter(id=>best[id]&&ex(id));if(!have.length)return "";
  if(!bw)return `<section class="card"><span class="eyebrow">Strength level</span><p class="mute">Log your bodyweight and Bruv will rate your bench, squat, deadlift and overhead press from Beginner to Elite.</p><button class="btn wide" data-act="bwLog">⚖️ Log bodyweight</button></section>`;
  return `<section class="card"><span class="eyebrow">Strength level</span>${have.map(id=>{const t=STD[id],r=best[id].e/bw;let i=-1;while(i+1<t.length&&r>=t[i+1])i++;
    return `<div class="std"><div class="rowb"><span>${esc(ex(id).name)}</span><b>${r.toFixed(2)}× bodyweight</b></div><div class="tier">${t.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div><small><b>${i<0?"Pre-beginner":TIERS[i]}</b>${i<t.length-1?` · ${TIERS[i+1]} at ${fe(t[i+1]*bw)} ${S.unit} est. max`:" · top tier. Absolute unit."}</small></div>`}).join("")}
    <p class="mute" style="font-size:12px">Estimated max divided by bodyweight, against common lifting standards.</p></section>`;
}

/* --- exercise detail --- */
const setChip=(e,s,flags)=>`<span class="${flags.has(s)?"p":""}${s.t==="w"?" w":""}">${s.t?`<i class="ty ${s.t}">${s.t.toUpperCase()}</i> `:""}${setTxt(e,s)}${s.rpe?` <small>@${s.rpe}</small>`:""}</span>`;
function openEx(id){
  const e=ex(id);if(!e)return;const {best,flags}=scan(),b=best[id],bw=isBW(e),ses=S.workouts.filter(w=>w.items.some(it=>it.ex===id&&nWork(it))).reverse(),RM=[1,2,3,5,8,10,12,15],rm={};
  for(const w of S.workouts)for(const it of w.items)if(it.ex===id)for(const s of it.sets)if(isWork(s))for(const r of RM)if(s.r>=r&&(!rm[r]||s.w>rm[r]))rm[r]=s.w;
  sheet(`<div><span class="eyebrow">${esc(e.muscle)} · ${EQ[e.eq]}</span><h2 class="d it" style="font-size:42px;margin-top:6px">${esc(e.name)}</h2></div>
    ${CUES[id]?`<div class="cue"><b>💡 Bruv's form tip</b><p>${esc(CUES[id])}</p></div>`:""}
    ${e.note?`<p class="note">📝 ${esc(e.note)}</p>`:""}<button class="btn sm" data-act="noteEx" data-id="${id}">${e.note?"Edit note":"+ Add a note (seat, grip…)"}</button>
    ${b?`<div class="tiles"><div class="tile"><b>${bw?b.r:fw(b.w)}</b><span>${bw?"most reps":"heaviest "+S.unit}</span></div><div class="tile gold"><b>${bw?(b.w>0?"+"+fw(b.w):"BW"):fe(b.e)}</b><span>${bw?"most added":"est. max "+S.unit}</span></div><div class="tile"><b>${b.sessions}</b><span>sessions</span></div></div>`:`<p class="empty">Not logged yet. Bruv's waiting.</p>`}
    ${b&&!bw?`<span class="eyebrow">Rep maxes · best weight for at least that many reps</span><div class="rmt">${RM.map(r=>`<div><span>${r} rep${r>1?"s":""}</span><b>${rm[r]!=null?fw(rm[r]):"—"}</b></div>`).join("")}</div>`:""}
    ${ses.length>1?`<div class="chart">${lineChart(series(id,bw?"reps":"e1rm"),bw?"reps":S.unit)}</div>`:""}
    ${ses.length?`<span class="eyebrow">History</span><div class="wdet">${ses.slice(0,15).map(w=>{const it=w.items.find(x=>x.ex===id);return `<div class="it"><div class="mute"><b>${fdate(w.start)}</b> · ${esc(w.name)}</div><div class="ss">${it.sets.map(s=>setChip(e,s,flags)).join("")}</div></div>`}).join("")}</div>`:""}`);
}

/* --- share card --- */
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
function rr(x,a,b,w,h,r){x.beginPath();if(x.roundRect)x.roundRect(a,b,w,h,r);else x.rect(a,b,w,h)}
function wrapText(x,t,max){const out=[];let line="";for(const w of t.split(" ")){const tt=line?line+" "+w:w;if(x.measureText(tt).width>max&&line){out.push(line);line=w}else line=tt}if(line)out.push(line);return out.slice(0,3)}
async function shareCard(id){
  const w=S.workouts.find(x=>x.id===id);if(!w)return;toast("Making your card…");
  try{await Promise.all([document.fonts.load('italic 800 100px "Barlow Condensed"'),document.fonts.load('700 30px Inter'),document.fonts.load('600 30px Inter')])}catch(e){}
  const c=document.createElement("canvas");c.width=1080;c.height=1350;const x=c.getContext("2d"),{flags}=scan();
  const g=x.createRadialGradient(1000,-60,40,780,260,1400);g.addColorStop(0,"#6a8dff");g.addColorStop(.3,"#2b55f0");g.addColorStop(.62,"#121d52");g.addColorStop(1,"#09090c");x.fillStyle=g;x.fillRect(0,0,1080,1350);
  x.save();x.font='italic 800 560px "Barlow Condensed"';x.fillStyle="rgba(255,255,255,.05)";x.textAlign="right";x.fillText(abbr(w.name),1120,1330);x.restore();
  try{const im=await loadImg("bruv/chain_0.png"),h=430,wd=im.width*h/im.height;x.save();x.shadowColor="rgba(0,0,0,.45)";x.shadowBlur=40;x.shadowOffsetY=20;x.drawImage(im,1080-wd-40,60,wd,h);x.restore()}catch(e){}
  x.fillStyle="rgba(255,255,255,.75)";x.font='700 32px Inter';x.fillText(fdate(w.start,{weekday:"long",day:"numeric",month:"long"}).toUpperCase(),80,130);
  x.fillStyle="#fff";x.font='italic 800 150px "Barlow Condensed"';let y=275;for(const line of wrapText(x,w.name.toUpperCase(),600)){x.fillText(line,74,y);y+=132}
  y=Math.max(y+20,600);
  [[dur((w.end||w.start)-w.start),"TIME"],[String(wSets(w)),"SETS"],[kfmt(toD(wVol(w))),S.unit.toUpperCase()+" MOVED"]].forEach(([v,l],i)=>{const bx=80+i*313;x.fillStyle="rgba(255,255,255,.09)";rr(x,bx,y,293,190,36);x.fill();x.fillStyle="#fff";x.font='italic 800 104px "Barlow Condensed"';x.fillText(v,bx+30,y+118);x.fillStyle="rgba(255,255,255,.6)";x.font='700 24px Inter';x.fillText(l,bx+32,y+160)});
  y+=270;
  const prs=[],tops=[];for(const it of w.items){const e=ex(it.ex);if(!e)continue;let top=null,pr=null;for(const s of it.sets){if(!isWork(s))continue;if(!top||e1(s.w,s.r)>e1(top.w,top.r))top=s;if(flags.has(s)&&(!pr||e1(s.w,s.r)>=e1(pr.w,pr.r)))pr=s}if(pr)prs.push([e,pr]);else if(top)tops.push([e,top])}
  const list=prs.length?prs:tops,max=y>900?3:4;
  x.fillStyle=prs.length?"#ffc83d":"rgba(255,255,255,.8)";x.font='italic 800 64px "Barlow Condensed"';x.fillText(prs.length?`🏆 ${prs.length} NEW PR${prs.length>1?"S":""}`:"TOP SETS",80,y);
  for(const [e,s] of list.slice(0,max)){y+=92;x.fillStyle=prs.length?"rgba(255,200,61,.13)":"rgba(255,255,255,.07)";rr(x,80,y-62,920,78,24);x.fill();x.fillStyle="#fff";x.font='600 34px Inter';x.fillText(e.name.length>26?e.name.slice(0,25)+"…":e.name,112,y-10);x.fillStyle=prs.length?"#ffc83d":"#fff";x.font='italic 800 50px "Barlow Condensed"';x.textAlign="right";x.fillText(setTxt(e,s)+(isBW(e)&&!s.w?"":" "+S.unit),970,y-6);x.textAlign="left"}
  const r=rankOf(xpOf());x.fillStyle="rgba(255,255,255,.14)";x.fillRect(80,1225,920,2);x.font='italic 800 54px "Barlow Condensed"';x.fillStyle="#fff";x.fillText("BRUV",80,1296);const bwid=x.measureText("BRUV ").width;x.fillStyle="#6a8dff";x.fillText("LIFTS",80+bwid,1296);
  x.textAlign="right";x.fillStyle="rgba(255,255,255,.75)";x.font='700 30px Inter';x.fillText(`${r.ic} ${r.name.toUpperCase()}   🔥 ${streaks().cur}`,1000,1290);x.textAlign="left";
  const blob=await new Promise(res=>c.toBlob(res,"image/png")),file=new File([blob],`bruv-lifts-${new Date(w.start).toISOString().slice(0,10)}.png`,{type:"image/png"});
  $("#toast").hidden=true;
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==="AbortError")return}}
  sheet(`<h2 class="d it t2">Your card</h2><img src="${URL.createObjectURL(blob)}" style="width:100%;border-radius:18px" alt="Workout card"><p class="mute center">Press and hold the image to save or share it.</p>`);
}

/* --- haptics, live banner, count-ups --- */
const HAP=(()=>{const l=document.createElement("label");l.setAttribute("aria-hidden","true");l.style.cssText="position:fixed;left:-99px;top:0;width:1px;height:1px;overflow:hidden";const i=document.createElement("input");i.type="checkbox";i.setAttribute("switch","");i.tabIndex=-1;l.appendChild(i);document.body.appendChild(l);return l})();
function haptic(){try{if(navigator.userActivation&&!navigator.userActivation.hasBeenActive)return;if(navigator.vibrate)navigator.vibrate(12);else HAP.click()}catch(e){}}
function liveBanner(){const A=S.active;return `<button class="live-bn" data-act="go" data-tab="lift"><i></i><b>${esc(A.name)}</b><span id="elapsed2">${clock(Date.now()-A.start)}</span><em>Back to it →</em></button>`}
function animateCounts(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;for(const el of $$("[data-count]")){const to=+el.dataset.count;if(!to)continue;const t0=performance.now();const f=now=>{const p=Math.min(1,(now-t0)/750),k=1-Math.pow(1-p,3);el.textContent=Math.round(to*k);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}}

/* --- extra actions --- */
Object.assign(ACT,{
  exDetail:b=>openEx(b.dataset.id),
  noteEx:b=>{const e=ex(b.dataset.id);sheet(`<h2 class="d it t2">Note · ${esc(e.name)}</h2><textarea class="txt" id="nt" maxlength="200" placeholder="Seat on 4, wide grip, the blue bench by the window…">${esc(e.note||"")}</textarea><button class="btn pri wide" data-act="noteSave" data-id="${e.id}">Save</button>`)},
  noteSave:b=>{const e=ex(b.dataset.id);e.note=$("#nt").value.trim();save();closeSheet();render();toast("Note saved")},
  plates:b=>{const i=b.dataset.i!=null&&S.active?+b.dataset.i:null;plateSheet(i!=null?S.active.items[i].d.w:null,i)},
  plBar:b=>{PLB=+b.dataset.v;drawPlates()},
  plUse:()=>{if(PLI!=null&&S.active&&S.active.items[PLI]){S.active.items[PLI].d.w=PLW;save()}closeSheet();render()},
  orm:()=>ormSheet(),tools:()=>tools(),bwLog:()=>bwSheet(),
  bwSave:()=>{const v=parseFloat($("#bwv").value.replace(",","."));if(!(v>0)){toast("That's not a weight, Tony.");return}const t=day0(Date.now());S.bw=S.bw.filter(x=>day0(x.at)!==t);S.bw.push({at:Date.now(),kg:fromD(v)});S.bw.sort((a,b)=>a.at-b.at);save();closeSheet();render();haptic();toast("Bodyweight logged")},
  share:b=>shareCard(b.dataset.id),
  segPick:b=>{for(const c of b.parentElement.children)c.classList.toggle("on",c===b)},
  logWarm:b=>{const i=+b.dataset.i,it=S.active.items[i],wu=warmups(it);if(!wu)return;for(const [w,r] of wu)it.sets.push({w:fromD(w),r,at:Date.now(),t:"w"});save();render();haptic();say("Warm-ups in the bank. Now the real stuff.","talk")},
});

/* go */
render();wake();animateCounts();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
